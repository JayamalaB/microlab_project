org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disables incremental Kotlin compilation — required when the project drive (D:)
# differs from the pub cache drive (C:), which causes Kotlin to fail computing relative paths.
kotlin.incremental=false
