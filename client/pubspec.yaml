name: microlab
description: MicroLab - Home Blood Test Booking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  smooth_page_indicator: ^1.1.0
  google_fonts: ^6.1.0
  image_picker: ^1.1.2
  razorpay_flutter: ^1.3.7
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  http: ^1.2.2
  http_parser: ^4.0.2
  sms_autofill: ^2.3.0
  shared_preferences: ^2.3.4
  pdf: ^3.11.0
  printing: ^5.13.2
  socket_io_client: ^2.0.3+1
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  audioplayers: ^6.0.0
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/beeb_sound.mp3
