name: microlab
description: MicroLab - Home Blood Test Booking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  smooth_page_indicator: ^1.1.0
  google_fonts: ^6.1.0
  image_picker: ^1.1.2
  razorpay_flutter: ^1.3.7
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  http: ^1.2.2
  http_parser: ^4.0.2
  sms_autofill: ^2.3.0
  shared_preferences: ^2.3.4
  pdf: ^3.11.0
  printing: ^5.13.2
  webview_flutter: ^4.9.0         # YouTube inline player
  webview_flutter_android: ^4.0.0  # AndroidWebViewController.setMediaPlaybackRequiresUserGesture
  webview_flutter_web: ^0.2.3+4    # WebView support on Flutter web (Chrome)
  record: ^6.2.1              # microphone STT recording
  audioplayers: ^6.1.0        # TTS WAV playback
  path_provider: ^2.1.4       # temp directory for audio files
  socket_io_client: ^2.0.3+1
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  geocoding: ^3.0.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2
  flutter_foreground_task: ^8.14.0
  connectivity_plus: ^6.0.5
  device_info_plus: ^10.1.0
  open_filex: ^4.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/banners/banner1.jpg
    - assets/banners/banner2.png
    - assets/banners/banner3.png
    - assets/sounds/beeb_sound.mp3
    - assets/icon/app_icon.png
    - assets/icon/MicroLab-Logo.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

