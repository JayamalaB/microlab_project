name: microlab
description: MicroLab - Home Blood Test Booking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  smooth_page_indicator: ^1.1.0
  google_fonts: ^6.1.0
  image_picker: ^1.1.2
  razorpay_flutter: ^1.3.7
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  pdf: ^3.11.0
  printing: ^5.13.2
  http: ^1.2.0
  webview_flutter: ^4.9.0         # YouTube inline player
  webview_flutter_android: ^4.0.0  # AndroidWebViewController.setMediaPlaybackRequiresUserGesture
  webview_flutter_web: ^0.2.3+4    # WebView support on Flutter web (Chrome)
  record: ^7.0.0              # microphone STT recording
  audioplayers: ^6.1.0        # TTS WAV playback
  path_provider: ^2.1.0       # temp directory for audio files

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/banners/banner1.jpg
    - assets/banners/banner2.png
    - assets/banners/banner3.png
